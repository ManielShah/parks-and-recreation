services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      # Let Codespaces port forwarding reach the Vite dev server.
      VITE_HOST: 0.0.0.0
    # Share the database container's network so Postgres is on localhost, as in .env.example.
    network_mode: service:db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: parks
      POSTGRES_PASSWORD: parks
      POSTGRES_DB: parks
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

volumes:
  pgdata:
