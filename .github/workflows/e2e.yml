name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: API and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parks
          POSTGRES_PASSWORD: parks
          POSTGRES_DB: parks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://parks:parks@localhost:5432/parks
      TEST_DATABASE_URL: postgres://parks:parks@localhost:5432/parks_test
      ENABLE_DEV_TOOLS: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create the test database
        run: PGPASSWORD=parks psql -h localhost -U parks -d parks -c 'CREATE DATABASE parks_test'

      - run: npm run typecheck

      - name: API tests (concurrency, waitlist, offer windows) against Postgres
        run: npm test

      - name: Seed the demo
        run: npm run db:seed

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests in a real browser
        run: npm run e2e

      - name: Keep the report, screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
